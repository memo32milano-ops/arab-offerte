name: deals-bot

on:
  schedule:
    - cron: "5 */6 * * *"   # restarts the long-running loop every 6 hours
  workflow_dispatch: {}

permissions:
  contents: write
  actions: write

concurrency:
  group: deals-bot
  cancel-in-progress: true

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 358
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install requests==2.32.3

      - name: Run bot (loop ~6h, checks Telegram every minute)
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          CHANNEL_ID: "@ArabOfferteItalia"
          AMAZON_TAG: ${{ vars.AMAZON_TAG }}
          ADMIN_ID: ${{ secrets.ADMIN_ID }}
        run: ./run_loop.sh

      - name: Start the next loop (keeps the bot running 24/7)
        if: ${{ !cancelled() }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run bot.yml --ref main
